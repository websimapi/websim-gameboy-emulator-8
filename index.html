<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBoy Emulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="credits">
            <a href="https://github.com/juchi/gameboy.js/" target="_blank">Source: github.com/juchi/gameboy.js</a>
        </div>
        
        <div class="gameboy">
            <div class="screen-container">
                <canvas id="screen" width="160" height="144"></canvas>
            </div>
            
            <div class="controls">
                <div class="d-pad">
                    <button id="btn-up" class="direction">↑</button>
                    <button id="btn-left" class="direction">←</button>
                    <button id="btn-right" class="direction">→</button>
                    <button id="btn-down" class="direction">↓</button>
                    <div class="d-pad-center"></div>
                </div>
                
                <div class="action-buttons">
                    <button id="btn-b" class="action">B</button>
                    <button id="btn-a" class="action">A</button>
                </div>
                
                <div class="menu-buttons">
                    <button id="btn-select" class="menu">SELECT</button>
                    <button id="btn-start" class="menu">START</button>
                </div>
            </div>
            
            <div class="rom-loader">
                <input type="file" id="rom-file" accept=".gb,.gbc" />
                <button id="load-rom">Load ROM</button>
            </div>
        </div>
    </div>
    
    <script src="gameboy.js"></script>
    <script src="emulator.js"></script>

</body>
</html>
